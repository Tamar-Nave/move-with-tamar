<!doctype html>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A0573A}a:hover{color:#7E4229}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#4A4641}
.in{font-family:inherit;font-size:15px;color:#2B2622;background:#fff;border:1px solid #D9D5CE;border-radius:10px;min-height:42px;padding:0 10px;box-sizing:border-box;width:100%}
.ai{background:#FFF8E6;border:1px solid #F0D9A0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F0EEE4; font-family: 'Heebo', sans-serif; color: #2B2622; display: flex; flex-direction: column">
  <div style="padding: 48px 20px 8px; display: flex; justify-content: space-between; align-items: center; background: #2B2622; color: #fff">
    <h1 style="margin: 0; font-size: 20px">אימון חדש</h1>
    <span style="font-size: 12px; background: #3D3A36; border-radius: 6px; padding: 3px 8px">מצב ניהול</span>
  </div>
  <div style="flex-grow: 1; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="background: #fff; border: 1px solid #E4E1DB; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700">✦ מילוי מהיר: כתבי או הקליטי</div>
      <div style="display: flex; gap: 8px; align-items: flex-end">
        <textarea aria-label="תיאור האימון במילים" style="font-family: inherit; font-size: 14px; flex-grow: 1; min-height: 64px; border: 1px solid #D9D5CE; border-radius: 10px; padding: 8px; resize: none">SCULPT בחמישי 13.11 ב-19:00, 12 משתתפות, ביטול עד 24 שעות לפני, הרשמה נפתחת יומיים לפני</textarea>
        <button aria-label="הקלטה קולית" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #A0573A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      </div>
      <div style="font-size: 12px; color: #66625C">האפליקציה ממלאת את הטופס, ואת מאשרת לפני פרסום. השדות שמולאו מסומנים בצהוב.</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label class="f">סוג אימון<select class="in ai"><option>SCULPT</option><option>פונקציונלי</option></select></label>
      <label class="f">תאריך<input class="in ai" value="חמישי 13.11.26"></label>
      <label class="f">שעה<input class="in ai" value="19:00"></label>
      <label class="f">משך<input class="in" value="50 דק׳"></label>
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #4A4641; margin-top: 4px">כללי הרשמה</div>
    <div style="display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #E4E1DB; border-radius: 12px; padding: 6px 12px">
      <span style="font-size: 15px">מקסימום משתתפות</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="הפחתה" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D9D5CE; background: #fff; font-size: 18px">−</button>
        <strong style="width: 36px; text-align: center; font-size: 17px; background: #FFF8E6; border-radius: 6px">12</strong>
        <button aria-label="הוספה" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D9D5CE; background: #fff; font-size: 18px">+</button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label class="f">ההרשמה נפתחת<input class="in ai" value="11.11 · 19:00"></label>
      <label class="f">ביטול אפשרי עד<input class="in ai" value="24 שעות לפני"></label>
      <label class="f">זמן לאשר מקום מההמתנה<input class="in" value="30 דקות"></label>
      <label class="f">תזכורת למשתתפות<input class="in" value="שעתיים לפני"></label>
    </div>
    <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 44px">
      <input type="checkbox" style="width: 20px; height: 20px; accent-color: #A0573A">
      לשכפל את האימון לשבועות הבאים (אופציונלי)
    </label>
  </div>
  <div style="background: #fff; border-top: 1px solid #E4E1DB; padding: 12px 20px 28px; display: flex; gap: 10px">
    <button style="font-family: inherit; flex-grow: 2; min-height: 50px; border-radius: 14px; border: 0; background: #A0573A; color: #fff; font-size: 16px; font-weight: 700">פרסום האימון</button>
    <button style="font-family: inherit; flex-grow: 1; min-height: 50px; border-radius: 14px; border: 1px solid #CFCBC3; background: #fff; font-size: 15px">טיוטה</button>
  </div>
</div>
</x-dc>

</html>
