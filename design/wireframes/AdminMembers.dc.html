<helmet>

a{color:#A0573A}a:hover{color:#7E4229}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E4E1DB;border-radius:14px;padding:10px 12px}
.av{width:40px;height:40px;border-radius:20px;background:#E9E6E0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#5A564F;flex-shrink:0}

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F0EEE4; font-family: 'Heebo', sans-serif; color: #2B2622; display: flex; flex-direction: column">
  <div style="padding: 48px 20px 8px; display: flex; justify-content: space-between; align-items: center; background: #2B2622; color: #fff">
    <h1 style="margin: 0; font-size: 20px">מתאמנות</h1>
    <span style="font-size: 12px; background: #3D3A36; border-radius: 6px; padding: 3px 8px">מצב ניהול</span>
  </div>
  <div style="flex-grow: 1; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

      <button class="fb">8 כניסות (15)</button>
      <button class="fb">לא פעיל (2)</button>
    </div>

    <div class="row"><div class="av">נ</div><div style="flex-grow: 1"><strong style="font-size: 15px">נועה לוי</strong><div style="font-size: 12px; color: #66625C">8 כניסות · נשארו 5</div></div><span class="chip" style="background: #E3F1E6; color: #1F5F2E">פעיל</span></div>
    <div class="row"><div class="av">מ</div><div style="flex-grow: 1"><strong style="font-size: 15px">מיכל כהן</strong><div style="font-size: 12px; color: #66625C">ללא הגבלה · 11 אימונים החודש</div></div><span class="chip" style="background: #E3F1E6; color: #1F5F2E">פעיל</span></div>
    <div class="row"><div class="av">ש</div><div style="flex-grow: 1"><strong style="font-size: 15px">שירה אברהם</strong><div style="font-size: 12px; color: #66625C">8 כניסות · נשארה 1</div></div><span class="chip" style="background: #FDEBD8; color: #8A3A0C">כמעט נגמר</span></div>
    <div class="row"><div class="av">ד</div><div style="flex-grow: 1"><strong style="font-size: 15px">דנה פרץ</strong><div style="font-size: 12px; color: #66625C">ההזמנה נשלחה, עוד לא נכנסה</div></div><span class="chip" style="background: #ECEAE6; color: #4A4641">ממתינה</span></div>

    <div style="background: #fff; border: 2px solid #A0573A; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 4px">

        <button style="font-family: inherit; min-height: 44px; border-radius: 10px; border: 2px solid #A0573A; background: #F6E6DC; color: #A0573A; font-size: 14px; font-weight: 700">8 כניסות לחודש</button>
      </div>
      <label style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">בתוקף עד<input value="31.12.26" style="font-family: inherit; font-size: 14px; border: 1px solid #D9D5CE; border-radius: 8px; min-height: 38px; padding: 0 8px; width: 120px"></label>
      <div style="display: flex; gap: 8px">
        <button style="font-family: inherit; flex-grow: 1; min-height: 44px; border-radius: 10px; border: 0; background: #A0573A; color: #fff; font-size: 14px; font-weight: 700">שמירה</button>
